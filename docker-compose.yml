services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plm}
      POSTGRES_USER: ${POSTGRES_USER:-plm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    restart: unless-stopped

  # one-shot: schema exclusively via Alembic, before the API starts
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plm}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-plm}
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plm}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-plm}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      PLM_AGENT_EMAIL: ${PLM_AGENT_EMAIL:-}
      PLM_AGENT_PASSWORD: ${PLM_AGENT_PASSWORD:-}
      STORAGE_DIR: /data/files
    volumes:
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      AGENT_PROXY_TARGET: http://agent:8001
      PREVIEWS_PROXY_TARGET: http://previews:8002
    depends_on:
      api:
        condition: service_started
      agent:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

  previews:
    build:
      context: .
      dockerfile: previews/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plm}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-plm}
      STORAGE_DIR: /data/files
    volumes:
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # AI agent service (M10): SSE chat API on 8001, talks to api + litellm
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      PLM_API_URL: http://api:8000
      # passthrough from .env — direct provider (e.g. https://api.mistral.ai/v1) or litellm proxy (default)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://litellm:4000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-plm-chat}
      PLM_AGENT_EMAIL: ${PLM_AGENT_EMAIL}
      PLM_AGENT_PASSWORD: ${PLM_AGENT_PASSWORD}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_started
    # NOTE: no depends_on litellm — with a direct LLM provider the proxy is optional
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/litellm.config.yaml"]
    volumes:
      - ./agent/litellm.config.yaml:/app/litellm.config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata:
  filedata:
