name: CI

on:
  push:
    branches: [main, "vibe/*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plm_test
          POSTGRES_USER: plm
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U plm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: pip install -e "agent[dev]"
      - run: ruff check backend agent
      - name: Agent tests
        run: pytest agent/tests
      - name: Alembic Migration gegen frische Test-DB
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://plm:test@localhost:5432/plm_test
      - name: Tests
        run: pytest backend/tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://plm:test@localhost:5432/plm_test
